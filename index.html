<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 과학과 성취평가 문항 목표 수준 분석실</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 1rem; }
        .spinner { border: 3px solid rgba(59, 130, 246, 0.1); border-radius: 50%; border-top: 3px solid #3b82f6; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .level-A { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .level-B { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .level-C { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .level-D { background-color: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
        .level-E { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
    </style>
</head>
<body class="text-gray-800 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <header class="w-full max-w-5xl mb-8 text-center mt-4">
        <h1 class="text-2xl md:text-4xl font-bold text-gray-900 tracking-tight mb-3">
            <span class="text-blue-600">2022 개정</span> 과학과 문항 목표 수준 분석실
        </h1>
        <p class="text-gray-500 max-w-2xl mx-auto text-sm md:text-base">
            정기시험 문항지(PDF)를 업로드하면, AI가 각 문항을 스스로 5번 교차 분석하여 가장 확실한 목표 성취 수준(A~E)과 근거를 도출해 냅니다.
        </p>
    </header>

    <main class="w-full max-w-5xl flex flex-col gap-6">
        
        <!-- 1. 설정 패널 -->
        <div class="glass-panel p-6 md:p-8">
            <h2 class="text-lg font-semibold mb-6 border-b pb-3 flex items-center gap-2">
                ⚙️ 분석 설정 및 준비
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 과목 선택 -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">대상 과목 선택</label>
                    <select id="subjectSelect" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white cursor-pointer transition">
                        <option value="">과목을 선택해주세요</option>
                    </select>
                </div>
                <!-- 파일 업로드 -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">문항지 파일 (PDF)</label>
                    <div class="relative w-full">
                        <input type="file" id="pdfUpload" accept="application/pdf" class="hidden" />
                        <label for="pdfUpload" class="cursor-pointer flex items-center justify-between px-4 py-3 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 transition text-sm">
                            <span id="fileNameDisplay" class="text-gray-500 truncate mr-2">PDF 파일 선택...</span>
                            <span class="bg-blue-50 text-blue-600 font-medium px-3 py-1 rounded-md text-xs border border-blue-100">찾기</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="mt-8 flex justify-end">
                <button id="startBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-10 rounded-lg transition disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2 shadow-md" disabled>
                    분석 시작
                </button>
            </div>
        </div>

        <!-- 2. 진행 상태 패널 -->
        <div id="progressPanel" class="glass-panel p-6 md:p-8 hidden">
            <div class="flex justify-between items-end mb-2">
                <div>
                    <h3 class="text-lg font-bold flex items-center gap-2" id="currentStatusText">
                        <div class="spinner"></div> 분석 진행 중...
                    </h3>
                    <p class="text-sm text-gray-500 mt-1" id="statusDetailText">준비 중입니다.</p>
                </div>
                <div class="text-right">
                    <div class="text-xs font-medium text-gray-400 mb-1">예상 소요 시간</div>
                    <div class="text-2xl font-bold text-blue-600 font-mono tracking-wider" id="estimatedTime">--:--</div>
                </div>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-4 mt-5 overflow-hidden border border-gray-200">
                <div id="progressBar" class="bg-blue-500 h-full transition-all duration-500 ease-out flex items-center justify-end pr-2" style="width: 0%">
                    <span id="progressPercent" class="text-[10px] text-white font-bold hidden">0%</span>
                </div>
            </div>
            <div class="flex justify-between mt-3 text-sm font-medium text-gray-600">
                <span id="progressCount">0 / 0 문항 완료</span>
                <span id="batchInfo" class="text-blue-500">배치 대기 중</span>
            </div>
        </div>

        <!-- 3. 결과 패널 -->
        <div id="resultPanel" class="glass-panel overflow-hidden hidden">
            <div class="p-5 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <span class="text-xl">📊</span> 분석 결과 보고서
                </h2>
                <button id="copyBtn" class="text-sm bg-white border border-gray-300 px-4 py-2 rounded-md hover:bg-gray-100 transition font-medium flex items-center gap-1 shadow-sm">
                    📋 결과 표 복사하기
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white text-gray-500 text-sm border-b border-gray-200">
                            <th class="p-4 font-semibold w-20 text-center">문항</th>
                            <th class="p-4 font-semibold w-64">관련 성취기준</th>
                            <th class="p-4 font-semibold w-24 text-center">수준</th>
                            <th class="p-4 font-semibold">분석 근거 (AI 5중 교차검증)</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="text-sm bg-white divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const subjectsData = [
            { group: "공통 과목", items: ["통합과학1", "통합과학2", "과학탐구실험1", "과학탐구실험2"] },
            { group: "일반 선택 과목", items: ["물리학", "화학", "생명과학", "지구과학"] },
            { group: "진로 선택 과목", items: ["역학과 에너지", "전자기와 양자", "물질과 에너지", "화학 반응의 세계", "세포와 물질대사", "생물의 유전과 진화", "지구시스템과학", "행성 우주과학"] },
            { group: "융합 선택 과목", items: ["과학의 역사와 문화", "기후 변화와 환경 생태", "융합과학 탐구"] }
        ];

        const els = {
            subject: document.getElementById('subjectSelect'),
            upload: document.getElementById('pdfUpload'),
            fileDisp: document.getElementById('fileNameDisplay'),
            start: document.getElementById('startBtn'),
            progPan: document.getElementById('progressPanel'),
            status: document.getElementById('currentStatusText'),
            detail: document.getElementById('statusDetailText'),
            time: document.getElementById('estimatedTime'),
            bar: document.getElementById('progressBar'),
            percent: document.getElementById('progressPercent'),
            count: document.getElementById('progressCount'),
            batch: document.getElementById('batchInfo'),
            resPan: document.getElementById('resultPanel'),
            tbody: document.getElementById('resultTableBody'),
            copy: document.getElementById('copyBtn')
        };

        let state = { file: null, timer: null, seconds: 0, isRunning: false };

        window.addEventListener('DOMContentLoaded', () => {
            subjectsData.forEach(g => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = g.group;
                g.items.forEach(s => {
                    const option = document.createElement('option');
                    option.value = option.textContent = s;
                    optgroup.appendChild(option);
                });
                els.subject.appendChild(optgroup);
            });
            checkReady();
        });

        els.subject.addEventListener('change', checkReady);
        els.upload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                state.file = e.target.files[0];
                els.fileDisp.textContent = state.file.name;
                els.fileDisp.classList.add('text-blue-700', 'font-semibold');
            }
            checkReady();
        });
        els.start.addEventListener('click', runAnalysis);

        function checkReady() {
            els.start.disabled = !(els.subject.value && state.file && !state.isRunning);
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        // 구글 API 직접 호출 대신 우리가 만든 Vercel 서버리스 함수(/api/analyze)를 호출합니다.
        async function fetchBackend(payload) {
            const url = `/api/analyze`; 
            for (let i = 0; i < 3; i++) {
                try {
                    const res = await fetch(url, { 
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ payload: payload }) // payload를 감싸서 전송
                    });
                    if (res.ok) return await res.json();
                    
                    if (res.status === 429 || res.status === 503) {
                        els.detail.textContent = `서버 일시 혼잡(재시도 중... ${i+1}/3)`;
                        await delay(5000); 
                        continue;
                    }
                    throw new Error(`API 응답 오류: HTTP ${res.status}`);
                } catch (e) {
                    if (i === 2) throw e;
                    await delay(3000);
                }
            }
        }

        function formatTime(sec) {
            const m = Math.floor(Math.max(sec, 0) / 60).toString().padStart(2, '0');
            const s = Math.floor(Math.max(sec, 0) % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        async function extractPDF(file) {
            const arr = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arr).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                text += (await (await pdf.getPage(i)).getTextContent()).items.map(t => t.str).join(" ") + "\n";
            }
            return text;
        }

        async function runAnalysis() {
            try {
                state.isRunning = true; checkReady();
                els.start.innerHTML = `<div class="spinner border-white border-t-white mr-2"></div> 분석 중...`;
                els.progPan.classList.remove('hidden'); els.resPan.classList.add('hidden');
                els.tbody.innerHTML = ''; els.bar.style.width = '0%'; els.percent.classList.add('hidden');
                
                els.detail.textContent = "PDF 파일에서 문항 텍스트를 읽고 있습니다...";
                const text = await extractPDF(state.file);
                
                els.detail.textContent = "AI가 문항 번호와 내용을 분리하고 있습니다...";
                const qPayload = {
                    contents: [{ parts: [{ text: `다음은 과학 시험지 원문입니다. 객관식 보기, 지문, 그림 설명을 포함하여 번호별 "문항"으로 정확히 분리해주세요.\n\n---\n${text.substring(0, 30000)}\n---` }] }],
                    generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "OBJECT", properties: { "qNum": { type: "INTEGER" }, "text": { type: "STRING" } } } } }
                };
                
                // 백엔드 호출
                const qRes = await fetchBackend(qPayload);
                const questions = JSON.parse(qRes.candidates[0].content.parts[0].text).sort((a, b) => a.qNum - b.qNum);
                
                if(!questions.length) throw new Error("문항을 추출하지 못했습니다.");

                const BATCH = 5;
                state.seconds = Math.ceil(questions.length / BATCH) * 6 + 5;
                state.timer = setInterval(() => { state.seconds--; els.time.textContent = formatTime(state.seconds); }, 1000);

                let processed = 0;
                
                for (let i = 0; i < questions.length; i += BATCH) {
                    const batch = questions.slice(i, i + BATCH);
                    els.batch.textContent = `[${batch[0].qNum} ~ ${batch[batch.length-1].qNum}번] 분석 중...`;
                    els.detail.textContent = "AI가 내부 교차 검증을 통해 최빈값 결과를 도출하고 있습니다.";

                    const promptText = batch.map(q => `[문항 ${q.qNum}]\n${q.text}`).join('\n\n');
                    
                    const aPayload = {
                        systemInstruction: { 
                            parts: [{ 
                                text: `당신은 2022 개정 교육과정 '${els.subject.value}' 과목의 평가 전문가입니다.
[핵심 지침] 각 문항의 성취 수준(A, B, C, D, E)을 마음속으로 5번 교차 분석해 보고, 가장 많이 나온 결과(최빈값) 하나만 최종 출력하세요.
출력 규칙 (반드시 지킬 것):
1. 'standards': 이 문항과 가장 관련 깊은 성취기준 1~3개 (배열)
2. 'level': A, B, C, D, E 중 판단된 최빈값 1개
3. 'rationale': 5번의 검증을 거쳐 해당 수준으로 판별한 종합적 근거. 반드시 '~함.', '~임.' 형태의 1~2문장 개조식으로 작성.` 
                            }] 
                        },
                        contents: [{ parts: [{ text: `다음 문항들을 분석하세요:\n\n${promptText}` }] }],
                        generationConfig: { 
                            temperature: 0.3,
                            responseMimeType: "application/json", 
                            responseSchema: { type: "ARRAY", items: { type: "OBJECT", properties: { "qNum": { type: "INTEGER" }, "standards": { type: "ARRAY", items: { type: "STRING" } }, "level": { type: "STRING" }, "rationale": { type: "STRING" } } } } 
                        }
                    };
                    
                    // 백엔드 호출
                    const aRes = await fetchBackend(aPayload);
                    const results = JSON.parse(aRes.candidates[0].content.parts[0].text);
                    
                    results.forEach(d => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition-colors";
                        const stds = d.standards.map(s => `<div class="truncate text-xs mb-1" title="${s}">• ${s}</div>`).join('');
                        tr.innerHTML = `
                            <td class="p-4 text-center font-bold text-gray-700">${d.qNum}</td>
                            <td class="p-4 text-gray-600">${stds}</td>
                            <td class="p-4 text-center"><span class="inline-block px-3 py-1 font-bold rounded-lg text-sm level-${d.level}">${d.level}</span></td>
                            <td class="p-4 text-gray-700 leading-relaxed break-keep">${d.rationale}</td>
                        `;
                        els.tbody.appendChild(tr);
                    });
                    els.resPan.classList.remove('hidden');
                    
                    processed += batch.length;
                    const pct = Math.round((processed / questions.length) * 100);
                    els.bar.style.width = `${pct}%`;
                    els.percent.classList.remove('hidden'); els.percent.textContent = `${pct}%`;
                    els.count.textContent = `${processed} / ${questions.length} 문항 완료`;
                    
                    if(i + BATCH < questions.length) await delay(2000);
                }

                clearInterval(state.timer);
                els.status.innerHTML = `✅ 분석 완료`;
                els.detail.textContent = "모든 문항의 분석이 오류 없이 성공적으로 종료되었습니다.";
                els.time.textContent = "00:00"; els.batch.textContent = "작업 완료";

            } catch (e) {
                console.error(e);
                alert(`분석 중단됨: ${e.message}`);
                els.status.innerHTML = `⚠️ 분석 중단됨`; els.detail.textContent = e.message;
                if(state.timer) clearInterval(state.timer);
            } finally {
                state.isRunning = false; checkReady();
                els.start.innerHTML = `재분석 시작`;
            }
        }

        els.copy.addEventListener('click', () => {
            if(els.tbody.rows.length === 0) return;
            let tsv = "문항\t성취기준\t수준\t분석근거\n";
            Array.from(els.tbody.rows).forEach(r => {
                const stds = r.cells[1].innerText.replace(/\n/g, ', ').trim();
                tsv += `${r.cells[0].innerText.trim()}\t${stds}\t${r.cells[2].innerText.trim()}\t${r.cells[3].innerText.trim()}\n`;
            });
            const ta = document.createElement("textarea"); ta.value = tsv; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
            const orig = els.copy.innerHTML; els.copy.innerHTML = `✅ 복사 완료! (엑셀에 붙여넣으세요)`; setTimeout(() => els.copy.innerHTML = orig, 2500);
        });
    </script>
</body>
</html>
